name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Ensure Android API 35 is available
        uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build the installable APK
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleDebug 2>&1 | tee build-output.log; then
            SUMMARY=$(sed -n '/\* What went wrong:/,/^\* Try:/p' build-output.log | tr '\n' ' ' | cut -c1-3500)
            echo "::error title=APK build failed::${SUMMARY:-See the workflow log for details.}"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlignAlert-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
